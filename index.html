<body>
    <section id="test" class="test">

        <header>
            <h1>Elves in the World of Demons</h1>

            <section id="gameWindow"> 
                <!-- <button class ="burgerMenu">x</button> -->
                <canvas class="dnone" id="canvas" width="720" height="480"></canvas>
                <div id="winOrLose" class="winOrLose dnone"></div>

        </main>
        <div class="mainButton" id="mainButton">
            <button id="startGame" type="button " class="btn startGame" onclick="startGame()">

                <div id="container-stars">
                    <div id="stars"></div>
                </div>
                <div id="glow">
                    <div class="circle"></div>
                    <div class="circle"></div>
                </div>
            </button>
        </section>

    <div class="hud dnone">

            <div class="mobilBtnfield">
                <button id="btnLeft" class="mobileBtn"><img src="./gameassets/img/icons/arrow-left-square-svgrepo-com.svg" alt=""></button>
                <button id="btnRight" class="mobileBtn rotate180deg"><img src="./gameassets/img/icons/arrow-left-square-svgrepo-com.svg" alt=""></button>
            </div>
            <div class="mobilBtnfield">
                <button id="btnUp" class="mobileBtn rotate90deg"><img src="./gameassets/img/icons/arrow-left-square-svgrepo-com.svg" alt=""></button>
                <button id="btnAttack" class="mobileBtn attackBtn"><img src="./gameassets/img/icons/attack.svg" alt=""></button>
            </div>
        </div>

    </div>
