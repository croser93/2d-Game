<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hellgate Shadowfall</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./style/mobile.css" />
    <link rel="icon" type="image/x-icon" href="./gameassets/Collectable Object/Diamond.png"/>

    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/mana-bar.class.js"></script>
    <script src="./models/collecable-bar.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/archer.class.js"></script>
    <script src="./models/devil.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/collectable-items/collectable-coin.class.js"></script>
    <script src="./models/collectable-items/collectable-strong.class.js"></script>
    <script src="./models/collectable-items/collectable-live.class.js"></script>
    <script src="./models/attack-object.class.js"></script>

    <script src="./models/background.class.js"></script>
    <script src="./models/backgroundassets.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./level/level_1.js"></script>
    <script src="./script/sound.js"></script>
    <script src="./script/movabels.js"></script>
    <script src="./script/game.js"></script>
    <script src="./gameassets/templates/template.js"></script>
  </head>
  
  <body onload="init()" oncontextmenu="return true">

    <header class="content_beg_1440px">
      <h1>Hellgate Shadowfall</h1>
    </header>
    
    <main id="gameSection" class="gameSection">
      <button id="burgerBtn" class="burgerMenu " onclick="toggleBurgerMenu('burgerOutOfUI')"><img src="gameassets/img/icons/burger menu.png" alt="Burger Menu Button" /></button>


      <section id="gameWindow" class="content_beg_1440px">
        <canvas class="dnone" id="canvas" width="720" height="480"></canvas>
        
        <section class="ui">
          
          <button id="burgerBtnInCanvas" class="dnone" onclick="toggleBurgerMenu('burgerInUI')"><img src="gameassets/img/icons/burger menu.png" alt="Burger Menu Button" /></button>
          
          <div id="burgerInUI"></div>
          <div id="hudID"></div>
          
          <div id="uiSwitchMobileDevice" class="switchMobileDevice dnone"><h3>Switch Mobile Screen</h3></div>
        </section>
      </section>

      <div id="winOrLose" class="winOrLose dnone"></div>
      
      <div id="loadingScreen" class="loading-screen dnone">
        <div class="loading-content">
          <h2>Loading...</h2>
          <div class="loading-bar">
            <div id="loadingBar" class="loading-bar-fill"></div>
          </div>
          <p id="loadingPercentage">0%</p>
        </div>
      </div>
      
    </main>

    <footer id="footer">
      <div class="footerLine content_beg_1440px">     
        <a class="buttonFooter" href="./pages/impressum.html">Impressum</a>
        <a class="buttonFooter" href="https://github.com/croser93/2d-Game.git">GitHub</a>
      </div>
    </footer>
  
  <section class="addition">
    
    <div id="menuButtonLine" class="dnone">
      <div class="menuButtonLine content_beg_1440px">
        <button id="soundmode" class="iconSize"><div id="soundIcon" class="soundImg sound-off" onclick="toggleSoundmode()"></div></button>
        <button id="fullscreen" class="iconSize"><img src="./gameassets/img/icons/fullscreen.png" alt="Fullscreen Button" onclick="fullscreen()"/></button>
        <button id="info" class="iconSize"><img src="./gameassets/img/icons/info.png" alt="Info Button" onclick="openInfoDialog()"/> </button>
      </div>
    </div>

    <div id="mobileBtn"></div>
    
    <div class="mainButton" id="mainButton">
      <button id="startGame" type="button" class="btn startGame" onclick="startGame()">
        <strong>Start Game</strong>
        <div id="container-stars">
          <div id="stars"></div>
        </div>
        <div id="glow">
          <div class="circle"></div>
          <div class="circle"></div>
        </div>
      </button>
    </div>
    
    <dialog>
        <img class="dialogImg" src="./gameassets/img/dialog.png" alt="" />
        <button class="dialoCloseBtn" onclick="closeInfoDialog()"><img src="./gameassets/img/icons/button.png" alt="Close Dialog"/></button>
    </dialog>
    
    <div id="burgerOutOfUI"></div>
    <div id="switchMobileDevice" class="switchMobileDevice"><h3>Switch Mobile Screen</h3></div>
  </section>

  </body>
</html>
