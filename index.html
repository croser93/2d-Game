    <link rel="stylesheet" href="./gameassets/fonts/fonts.css">
    <link rel="icon" type="image/x-icon" href="./gameassets/Collectable Object/Diamond.png">

    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/mana-bar.class.js"></script>
    <script src="./models/collecable-bar.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/sound.class.js"></script>
    <script src="./models/archer.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/collectable-items/collectable-coin.class.js"></script>
    <script src="./models/collectable-items/collectable-strong.class.js"></script>
    <script src="./models/collectable-items/collectable-live.class.js"></script>
    <script src="./models/attack-object.class.js"></script>
    
    
    <script src="./models/background.class.js"></script>
    <script src="./models/backgroundassets.class.js"></script>

</head>
<body>

    <header>
            <h1>Elves in the WOrld of Demons</h1>
    </header>

    <main>    
            <canvas class="dnone" id="canvas" width="720" height="480"></canvas>
             <button id="startGame" type="button " class="btn startGame" onclick="startGame()">
                <strong>Start Game</strong>
                <div id="container-stars">
                    <div id="stars"></div>
                </div>

                <div id="glow">
                    <div class="circle"></div>
                    <div class="circle"></div>
                </div>
            </button>
    </main>

    <dialog>
        <img class="dialogImg" src="./gameassets/img/dialog.png" alt="">
        <button class="dialoCloseBtn" onclick="closeInfoDialog()">Schließen</button>
    </dialog>

    <footer>
        <div class="footerLine">
                <button id="soundmode"><img id="soundIcon" onclick="toggleSoundmode()" src="gameassets/img/icons/sound-svgrepo-com.svg" alt=""></button>
                <button id="fullscreen"><img src="./gameassets/img/icons/fullscreen.png" alt="" onclick="fullscreen()"></button>
                <button id="info"><img src="./gameassets/img/icons/Info.png" alt="" onclick="openInfoDialog()"></button>
        </div>

    </footer>
    
</body>
</html>
